[project]
name = "jarvis-home"
version = "0.1.0"
description = "Autonomous goal runner with voice front end, built on the Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.2.180",
  "anyio>=4",
  "httpx>=0.27",
]

[project.optional-dependencies]
voice = ["faster-whisper>=1.1", "sounddevice>=0.5", "numpy>=1.26", "openwakeword>=0.4", "piper-tts>=1.2"]
ingest = ["whisperx>=3.3"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
